<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="Config Editor 탭">
  <rect width="960" height="600" rx="12" fill="#0f1318" stroke="#313742"/>
  <rect x="1" y="1" width="150" height="598" rx="11" fill="#171b22"/>
  <text x="18" y="34" font-size="13" font-weight="700" fill="#e8825f">Harness Manager</text>
  <text x="20" y="78" font-size="12.5" fill="#9aa3b2">Timeline</text>
  <text x="20" y="111" font-size="12.5" fill="#9aa3b2">Workspace</text>
  <text x="20" y="146" font-size="12.5" fill="#9aa3b2">Catalog</text>
  <text x="20" y="180" font-size="12.5" fill="#9aa3b2">Cleanup</text>
  <rect x="0" y="195" width="151" height="28" fill="#222834"/>
  <rect x="0" y="195" width="3" height="28" fill="#e8825f"/>
  <text x="20" y="214" font-size="12.5" fill="#f3f5f9">Config Editor</text>
  <text x="170" y="40" font-size="17" font-weight="700" fill="#f3f5f9">Config Editor</text>
  <rect x="170" y="56" width="118" height="26" rx="6" fill="#222834" stroke="#e8825f"/>
  <text x="229" y="73" font-size="11" fill="#f3f5f9" text-anchor="middle">settings.json</text>
  <rect x="296" y="56" width="150" height="26" rx="6" fill="#1c2230" stroke="#313742"/>
  <text x="371" y="73" font-size="11" fill="#9aa3b2" text-anchor="middle">settings.local.json</text>
  <rect x="454" y="56" width="200" height="26" rx="6" fill="#1c2230" stroke="#313742"/>
  <text x="528" y="73" font-size="11" fill="#9aa3b2" text-anchor="middle">~/.claude.json</text>
  <rect x="592" y="61" width="56" height="16" rx="8" fill="#0b0e12" stroke="#3a3320"/>
  <text x="620" y="73" font-size="9" fill="#d6b24a" text-anchor="middle">읽기전용</text>
  <rect x="170" y="96" width="754" height="430" rx="8" fill="#15191f" stroke="#313742"/>
  <line x1="470" y1="96" x2="470" y2="526" stroke="#313742"/>
  <text x="186" y="124" font-size="11" font-weight="700" fill="#9aa3b2">JSON 트리</text>
  <text x="186" y="150" font-size="11" fill="#f3f5f9" font-family="Consolas, monospace">▾ { }  (root)</text>
  <text x="204" y="172" font-size="11" fill="#9aa3b2" font-family="Consolas, monospace">▾ "permissions"</text>
  <text x="224" y="194" font-size="11" fill="#9aa3b2" font-family="Consolas, monospace">"allow"  [ 12 ]</text>
  <rect x="180" y="204" width="282" height="22" rx="5" fill="#222834"/>
  <text x="204" y="220" font-size="11" fill="#e8825f" font-family="Consolas, monospace">▾ "env"</text>
  <text x="224" y="242" font-size="11" fill="#f3f5f9" font-family="Consolas, monospace">MAX_THINKING_TOKENS : 32000</text>
  <text x="224" y="264" font-size="11" fill="#9aa3b2" font-family="Consolas, monospace">DISABLE_TELEMETRY : true</text>
  <text x="204" y="288" font-size="11" fill="#9aa3b2" font-family="Consolas, monospace">"model" : "claude-opus-4-8"</text>
  <text x="204" y="310" font-size="11" fill="#9aa3b2" font-family="Consolas, monospace">"theme" : "dark"</text>
  <text x="490" y="124" font-size="11" font-weight="700" fill="#9aa3b2">선택: MAX_THINKING_TOKENS</text>
  <rect x="490" y="138" width="418" height="34" rx="6" fill="#0b0e12" stroke="#e8825f"/>
  <text x="504" y="160" font-size="12" fill="#f3f5f9" font-family="Consolas, monospace">32000</text>
  <text x="490" y="190" font-size="10.5" fill="#5a6675">타입: number — 핵심 키 타입 보존 검증</text>
  <line x1="490" y1="206" x2="908" y2="206" stroke="#313742"/>
  <text x="490" y="232" font-size="11" fill="#9aa3b2">💾 저장 시 평문 <tspan fill="#5fb878" font-family="Consolas, monospace">.bak</tspan> 백업 (20개 로테이션)</text>
  <text x="490" y="256" font-size="11" fill="#9aa3b2">🛡 baseHash 대조 — 동시 수정 시 <tspan fill="#e8825f">409 충돌</tspan> 차단</text>
  <text x="490" y="280" font-size="11" fill="#9aa3b2">⚛ temp 작성 → atomic rename 으로 교체</text>
  <rect x="490" y="476" width="80" height="32" rx="7" fill="#2a1d17" stroke="#e8825f"/>
  <text x="530" y="497" font-size="12" font-weight="600" fill="#e8825f" text-anchor="middle">저장</text>
  <rect x="580" y="476" width="92" height="32" rx="7" fill="#1c2230" stroke="#313742"/>
  <text x="626" y="497" font-size="12" fill="#9aa3b2" text-anchor="middle">되돌리기</text>
  <text x="170" y="586" font-size="10.5" fill="#5a6675">Config Editor — 트리/텍스트 편집 · 저장 시 .bak 백업 · 낙관적 동시성(409) · atomic rename</text>
</svg>
